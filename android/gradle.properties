org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Daemon disabled: multiple Gradle daemons (this CLI + Android Studio, which
# has the project open) were repeatedly fighting over the same build-logic
# and transform-cache locks, causing hangs and "in use by another process"
# failures. A daemonless build is slower to start each time but never hits
# that contention. The Kotlin compile daemon has its own separate lifecycle
# and was found leaking between builds too (leftover kotlin-compiler-daemon
# JVMs from previous runs still holding cache locks) — disabled alongside it.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
